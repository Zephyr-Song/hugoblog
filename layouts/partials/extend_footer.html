{{- /* Inspiration 星河背景效果 */ -}}
{{- if .Site.Params.inspiration.enabled }}
<link rel="stylesheet" href="/css/inspiration.css">
<script>
// 创建星河背景
function createStarBg() {
  if (document.getElementById('star-wrap')) return;

  var wrap = document.createElement('div');
  wrap.id = 'star-wrap';
  wrap.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:-1;opacity:0;transition:opacity 2s ease;background:linear-gradient(135deg,#0a1a0f,#0d2818);';

  var colors = [
    '#00E5FF','#FF6B6B','#FFD93D','#6BCB77',
    '#C9B1FF','#FF9A8B','#00D2FF','#FFB6C1',
    '#7CFFCB','#FFC300','#A29BFE','#FD79A8',
    '#55EFC4','#FF7675','#74B9FF','#FDCB6E'
  ];

  // 星星：随机分布，各色闪烁
  for (var i = 0; i < 60; i++) {
    var s = document.createElement('div');
    s.className = 'star';
    var c = colors[i % colors.length];
    var size = (1 + Math.random() * 2).toFixed(1);
    s.style.cssText = [
      'position:absolute',
      'width:' + size + 'px',
      'height:' + size + 'px',
      'background:' + c,
      'border-radius:50%',
      'box-shadow:0 0 ' + size + 'px ' + c,
      'left:' + (Math.random() * 100).toFixed(2) + '%',
      'top:' + (Math.random() * 100).toFixed(2) + '%',
      'animation:starTwinkle ' + (1 + Math.random() * 3).toFixed(2) + 's ease-in-out infinite',
      'animation-delay:' + (Math.random() * 3).toFixed(2) + 's',
      '--sc:' + c
    ].join(';');
    wrap.appendChild(s);
  }

  // 几颗大星星更亮
  for (var j = 0; j < 8; j++) {
    var b = document.createElement('div');
    b.className = 'star big';
    var c = colors[j % colors.length];
    b.style.cssText = [
      'position:absolute',
      'width:4px',
      'height:4px',
      'background:#fff',
      'border-radius:50%',
      'box-shadow:0 0 8px 3px ' + c + ', 0 0 20px 6px ' + c,
      'left:' + (Math.random() * 100).toFixed(2) + '%',
      'top:' + (Math.random() * 100).toFixed(2) + '%',
      'animation:bigStarPulse ' + (2 + Math.random() * 2).toFixed(2) + 's ease-in-out infinite',
      'animation-delay:' + (Math.random() * 3).toFixed(2) + 's'
    ].join(';');
    wrap.appendChild(b);
  }

  document.body.appendChild(wrap);
}

// 流星雨 Canvas 系统
function launchMeteorShower() {
  var canvas = document.createElement('canvas');
  canvas.id = 'meteor-canvas';
  canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;opacity:1;transition:opacity 1.5s ease;';
  document.body.appendChild(canvas);

  var ctx = canvas.getContext('2d');
  var w = canvas.width = window.innerWidth;
  var h = canvas.height = window.innerHeight;

  var meteors = [];
  var colors = ['#00E5FF', '#FF6B6B', '#FFD93D', '#C9B1FF', '#FF9A8B', '#FFB6C1', '#55EFC4', '#74B9FF'];

  function Meteor() {
    this.reset();
  }
  Meteor.prototype.reset = function() {
    this.x = w * (0.3 + Math.random() * 0.7); // 从屏幕右侧30%-100%区域开始
    this.y = -50 - Math.random() * 300;       // 从屏幕上方外开始
    this.len = 60 + Math.random() * 100;      // 拖尾长度 60-160
    this.speed = 2 + Math.random() * 4;       // 速度变慢：2-6（原来是8-20）
    this.angle = Math.PI / 4 + (Math.random() - 0.5) * 0.4; // 约45度，随机偏差更大
    this.vx = -this.speed * Math.cos(this.angle);
    this.vy = this.speed * Math.sin(this.angle);
    this.color = colors[Math.floor(Math.random() * colors.length)];
    this.life = 1.0;
    this.decay = 0.002 + Math.random() * 0.003; // 消失更慢
    this.delay = Math.random() * 120; // 随机延迟出现（帧数）
    this.active = this.delay <= 0;
  };
  Meteor.prototype.update = function() {
    if (!this.active) {
      this.delay--;
      if (this.delay <= 0) this.active = true;
      return;
    }
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
    if (this.life <= 0 || this.x < -this.len || this.y > h + this.len) {
      this.reset();
    }
  };
  Meteor.prototype.draw = function() {
    if (!this.active) return;
    var tailX = this.x - this.vx * (this.len / this.speed);
    var tailY = this.y - this.vy * (this.len / this.speed);

    var grad = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
    grad.addColorStop(0, this.color);
    grad.addColorStop(0.3, this.color);
    grad.addColorStop(1, 'transparent');

    ctx.save();
    ctx.globalAlpha = this.life * (0.6 + Math.random() * 0.4); // 轻微闪烁
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.5 + Math.random() * 1.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(tailX, tailY);
    ctx.stroke();

    // 头部光点
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 8 + Math.random() * 4;
    ctx.shadowColor = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 1.5 + Math.random(), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  };

  // 创建 25 颗流星
  for (var i = 0; i < 25; i++) {
    var m = new Meteor();
    m.y = Math.random() * h * 0.5; // 初始分散在画面上半部分
    meteors.push(m);
  }

  var frame = 0;
  function animate() {
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < meteors.length; i++) {
      meteors[i].update();
      meteors[i].draw();
    }
    frame++;
    if (frame < 360) { // 延长至约6秒（原来是180帧/3秒）
      requestAnimationFrame(animate);
    } else {
      // 淡出并移除
      canvas.style.opacity = '0';
      setTimeout(function() {
        if (canvas.parentNode) canvas.parentNode.removeChild(canvas);
      }, 2000);
    }
  }
  animate();

  // 窗口大小变化适配
  window.addEventListener('resize', function() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }, { once: true });
}

// 切换特效（手动关闭）
function toggleStar() {
  var wrap = document.getElementById('star-wrap');
  var btn = document.querySelector('.inspiration-btn');

  if (!wrap) {
    createStarBg();
    toggleStar();
    return;
  }

  if (wrap.style.opacity === '1') {
    wrap.style.opacity = '0';
    if (btn) btn.classList.remove('active');
  } else {
    wrap.style.opacity = '1';
    if (btn) btn.classList.add('active');
    // 触发流星雨！
    launchMeteorShower();
  }
}

// 初始化
document.addEventListener('DOMContentLoaded', function() {
  createStarBg();

  setTimeout(function() {
    var footer = document.querySelector('.home-info .entry-footer');
    if (footer) {
      var btn = document.createElement('button');
      btn.className = 'inspiration-btn';
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>Inspiration';
      btn.onclick = toggleStar;
      btn.style.cssText = 'display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:linear-gradient(135deg,#8fb3a9,#7a9e96);color:white;border:none;border-radius:30px;font-size:0.8rem;font-weight:500;cursor:pointer;transition:all 0.3s;box-shadow:0 2px 8px rgba(143,179,169,0.25);margin-top:0.5rem;';
      footer.appendChild(btn);
    }
  }, 500);
});
</script>
<style>
/* 普通星星闪烁 */
@keyframes starTwinkle {
  0%, 100% { opacity: 0.2; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.3); }
}
/* 大星星脉冲 */
@keyframes bigStarPulse {
  0%, 100% { opacity: 0.5; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.5); }
}
</style>
{{- end }}
