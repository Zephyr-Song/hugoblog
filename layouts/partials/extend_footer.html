<!-- 指尖粒子特效 -->
<script src="/js/cursor-effect.js" defer></script>

<link rel="stylesheet" href="/css/music-player.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css">
<script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/meting@2.0.1/dist/Meting.min.js"></script>

<!-- fixed+mini：右下角小圆钮，点击展开完整播放器 -->
<meting-js
  server="netease"
  type="playlist"
  id="2809513713"
  fixed="true"
  mini="true"
  list-folded="false"
  list-max-height="180px"
  autoplay="false"
  loop="all"
  order="random"
  volume="0.7"
  mutex="true"
  preload="auto"
  theme="#8fb3a9"
></meting-js>

<script>
// 确保播完一首自动跳下一首（兼容试听30秒的歌曲）
function bindAutoNext() {
  var apEl = document.querySelector('.aplayer');
  if (apEl && apEl._aplayer) {
    var ap = apEl._aplayer;
    // ended: 正常播完
    ap.on('ended', function () {
      ap.skipForward();
    });
    // error: 试听片段播完后可能触发 error 而非 ended
    ap.on('error', function () {
      setTimeout(function () { ap.skipForward(); }, 300);
    });
    return true;
  }
  return false;
}

// MetingJS 异步加载，轮询等待 APlayer 实例
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', pollAPlayer);
} else {
  pollAPlayer();
}

function pollAPlayer() {
  var count = 0;
  var timer = setInterval(function () {
    count++;
    if (bindAutoNext() || count > 60) {
      clearInterval(timer);
    }
  }, 500);
}
</script>
