<!-- 指尖粒子特效 -->
<script src="/js/cursor-effect.js" defer></script>

<link rel="stylesheet" href="/css/music-player.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css">
<script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/meting@2.0.1/dist/Meting.min.js"></script>

<!-- fixed+mini：右下角小圆钮，点击展开完整播放器 -->
<meting-js
  server="netease"
  type="playlist"
  id="2809513713"
  fixed="true"
  mini="true"
  list-folded="false"
  list-max-height="180px"
  autoplay="false"
  loop="all"
  order="random"
  volume="0.7"
  mutex="true"
  preload="auto"
  theme="#8fb3a9"
></meting-js>

<script>
// 监听底层 audio 元素，确保播完自动跳下一首
function setupAutoNext() {
  var audio = document.querySelector('.aplayer .aplayer-video');
  if (!audio) return false;
  audio.addEventListener('ended', function () {
    // 找到"下一首"按钮并点击
    var btn = document.querySelector('.aplayer .aplayer-icon-next');
    if (btn) btn.click();
  });
  return true;
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function () {
    var count = 0;
    var timer = setInterval(function () {
      count++;
      if (setupAutoNext() || count > 120) clearInterval(timer);
    }, 500);
  });
} else {
  var count = 0;
  var timer = setInterval(function () {
    count++;
    if (setupAutoNext() || count > 120) clearInterval(timer);
  }, 500);
}
</script>
