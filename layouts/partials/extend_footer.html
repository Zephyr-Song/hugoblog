{{- /* Inspiration 流星雨效果 */ -}}
{{- if .Site.Params.inspiration.enabled }}
<link rel="stylesheet" href="/css/inspiration.css">
<script>
// 创建流星背景
function createMeteorBg() {
  if (document.getElementById('meteor-wrap')) return;
  
  var wrap = document.createElement('div');
  wrap.id = 'meteor-wrap';
  wrap.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:-1;opacity:0;transition:opacity 1.5s ease;background:linear-gradient(135deg,#0a1a0f,#0d2818);';
  
  // 流星
  for (var i = 0; i < 20; i++) {
    var m = document.createElement('div');
    m.className = 'meteor';
    m.style.cssText = 'position:absolute;width:3px;height:3px;background:#2ECC71;border-radius:50%;box-shadow:0 0 6px #2ECC71,0 0 12px #27AE60;top:' + (Math.random()*40) + '%;left:' + (Math.random()*100) + '%;animation:meteorFall ' + (1.5 + Math.random()) + 's linear infinite;animation-delay:' + Math.random() + 's;';
    wrap.appendChild(m);
  }
  
  // 星星
  for (var j = 0; j < 15; j++) {
    var s = document.createElement('div');
    s.className = 'star-dot';
    s.style.cssText = 'position:absolute;width:2px;height:2px;background:#90EE90;border-radius:50%;box-shadow:0 0 4px #2ECC71;top:' + (Math.random()*60) + '%;left:' + (Math.random()*100) + '%;animation:starTwinkle 2s ease-in-out infinite;animation-delay:' + Math.random() + 's;';
    wrap.appendChild(s);
  }
  
  document.body.appendChild(wrap);
}

// 切换特效
function toggleMeteor() {
  var wrap = document.getElementById('meteor-wrap');
  var btn = document.querySelector('.inspiration-btn');
  
  if (!wrap) {
    createMeteorBg();
    toggleMeteor();
    return;
  }
  
  if (wrap.style.opacity === '1') {
    wrap.style.opacity = '0';
    if (btn) btn.classList.remove('active');
  } else {
    wrap.style.opacity = '1';
    if (btn) btn.classList.add('active');
    setTimeout(function() {
      wrap.style.opacity = '0';
      if (btn) btn.classList.remove('active');
    }, 5000);
  }
}

// 初始化
document.addEventListener('DOMContentLoaded', function() {
  createMeteorBg();
  
  // 添加按钮
  setTimeout(function() {
    var footer = document.querySelector('.home-info .entry-footer');
    if (footer) {
      var btn = document.createElement('button');
      btn.className = 'inspiration-btn';
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>Inspiration';
      btn.onclick = toggleMeteor;
      btn.style.marginTop = '1rem';
      footer.appendChild(btn);
    }
  }, 500);
});
</script>
<style>
@keyframes meteorFall {
  0% { transform: translate(0,0); opacity: 0; }
  5% { opacity: 1; }
  100% { transform: translate(300px, 300px); opacity: 0; }
}
@keyframes starTwinkle {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}
</style>
{{- end }}
