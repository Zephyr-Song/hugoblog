{{- /* Inspiration 动态背景 - 清新气泡版 */ -}}
{{- if .Site.Params.inspiration.enabled }}
<link rel="stylesheet" href="/css/inspiration.css">
<script>
(function() {
  function init() {
    if (document.getElementById('inspiration-bg')) return;

    // 背景层
    var bg = document.createElement('div');
    bg.id = 'inspiration-bg';
    bg.className = 'inspiration-bg';
    document.body.appendChild(bg);

    // 气泡粒子层
    var particles = document.createElement('div');
    particles.id = 'inspiration-particles';
    particles.className = 'inspiration-particles';
    
    for (var i = 0; i < 18; i++) {
      var p = document.createElement('div');
      p.className = 'particle';
      particles.appendChild(p);
    }
    document.body.appendChild(particles);

    // 闪烁光点
    var sparkles = document.createElement('div');
    sparkles.id = 'inspiration-sparkles';
    sparkles.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:-1;opacity:0;transition:opacity 1s ease;';
    for (var k = 0; k < 20; k++) {
      var s = document.createElement('div');
      s.className = 'sparkle';
      s.style.left = (Math.random() * 100) + '%';
      s.style.top = (Math.random() * 100) + '%';
      s.style.animationDelay = (Math.random() * 2) + 's';
      sparkles.appendChild(s);
    }
    document.body.appendChild(sparkles);
  }

  function toggleInspiration() {
    var bg = document.getElementById('inspiration-bg');
    var particles = document.getElementById('inspiration-particles');
    var sparkles = document.getElementById('inspiration-sparkles');
    var btn = document.querySelector('.inspiration-btn');
    var body = document.body;
    
    if (!bg || !particles) {
      init();
      toggleInspiration();
      return;
    }

    var isActive = bg.classList.contains('active');
    
    if (isActive) {
      bg.classList.remove('active');
      particles.classList.remove('active');
      if (sparkles) sparkles.style.opacity = '0';
      body.classList.remove('inspiration-active');
      if (btn) btn.classList.remove('active');
    } else {
      bg.classList.add('active');
      particles.classList.add('active');
      if (sparkles) sparkles.style.opacity = '1';
      body.classList.add('inspiration-active');
      if (btn) btn.classList.add('active');
      
      setTimeout(function() {
        bg.classList.remove('active');
        particles.classList.remove('active');
        if (sparkles) sparkles.style.opacity = '0';
        body.classList.remove('inspiration-active');
        if (btn) btn.classList.remove('active');
      }, 5000);
    }
  }

  window.toggleInspiration = toggleInspiration;
  init();

  document.addEventListener('click', function(e) {
    if (e.target.closest('.inspiration-btn')) {
      toggleInspiration();
    }
  });
})();

document.addEventListener('DOMContentLoaded', function() {
  setTimeout(function() {
    var footer = document.querySelector('.home-info .entry-footer');
    if (footer && !document.querySelector('.inspiration-btn')) {
      var btn = document.createElement('button');
      btn.className = 'inspiration-btn';
      btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>Inspiration';
      btn.onclick = toggleInspiration;
      footer.appendChild(btn);
      btn.style.marginTop = '1rem';
    }
  }, 500);
});
</script>
{{- end }}
