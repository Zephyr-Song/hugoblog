{{ if .Site.Params.musicPlayer.enabled }}
<!-- 悬浮音乐播放器 -->
<div id="music-player" class="music-player collapsed">
  <div class="music-toggle" id="music-toggle" title="音乐播放器">
    <span class="music-icon">🎵</span>
  </div>
  <div class="music-body">
    <div class="music-cover">
      <img id="music-cover-img" src="" alt="封面" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22><rect width=%2260%22 height=%2260%22 fill=%22%23667eea%22/><text x=%2230%22 y=%2238%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2224%22>♪</text></svg>'">
      <div class="music-play-btn" id="music-play-btn">
        <span id="play-icon">▶</span>
      </div>
    </div>
    <div class="music-info">
      <div class="music-title" id="music-title">加载中...</div>
      <div class="music-artist" id="music-artist">-</div>
      <div class="music-progress-wrap">
        <span class="music-time" id="music-current">0:00</span>
        <div class="music-progress" id="music-progress">
          <div class="music-progress-bar" id="music-progress-bar"></div>
        </div>
        <span class="music-time" id="music-duration">0:00</span>
      </div>
    </div>
    <div class="music-controls">
      <button class="music-btn" id="music-prev" title="上一首">⏮</button>
      <button class="music-btn" id="music-next" title="下一首">⏭</button>
      <button class="music-btn" id="music-volume" title="音量">🔊</button>
    </div>
    <div class="music-playlist" id="music-playlist">
      <!-- 歌单列表由JS渲染 -->
    </div>
  </div>
</div>

<audio id="music-audio" preload="none"></audio>

<style>
.music-player {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  font-family: var(--font-secondary, sans-serif);
  user-select: none;
}
.music-toggle {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, #667eea, #764ba2);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(102,126,234,0.4);
  transition: transform 0.2s, box-shadow 0.2s;
  margin-left: auto;
}
.music-toggle:hover { transform: scale(1.1); box-shadow: 0 6px 20px rgba(102,126,234,0.5); }
.music-icon { font-size: 20px; }
.music-body {
  background: var(--entry, #fff);
  border: 1px solid var(--border, #e5e5e5);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 10px;
  width: 280px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  display: none;
}
.music-player:not(.collapsed) .music-body { display: block; }
.music-cover {
  position: relative;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  overflow: hidden;
  margin: 0 auto 12px;
  cursor: pointer;
}
.music-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.music-cover.spinning img {
  animation: spin 8s linear infinite;
}
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.music-play-btn {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.3);
  opacity: 0;
  transition: opacity 0.2s;
  font-size: 20px;
  color: #fff;
}
.music-cover:hover .music-play-btn { opacity: 1; }
.music-info { text-align: center; margin-bottom: 10px; }
.music-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary, #333);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 248px;
}
.music-artist {
  font-size: 12px;
  color: var(--secondary, #888);
  margin-top: 2px;
}
.music-progress-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
}
.music-time { font-size: 11px; color: var(--secondary, #888); min-width: 32px; }
.music-progress {
  flex: 1;
  height: 4px;
  background: var(--tertiary, #ddd);
  border-radius: 2px;
  cursor: pointer;
  position: relative;
}
.music-progress-bar {
  height: 100%;
  background: linear-gradient(90deg, #667eea, #764ba2);
  border-radius: 2px;
  width: 0%;
  transition: width 0.5s linear;
}
.music-controls {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 8px;
}
.music-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 18px;
  padding: 4px 8px;
  border-radius: 8px;
  color: var(--primary, #333);
  transition: background 0.2s;
}
.music-btn:hover { background: var(--tertiary, #eee); }
.music-playlist {
  margin-top: 12px;
  max-height: 150px;
  overflow-y: auto;
  border-top: 1px solid var(--border, #eee);
  padding-top: 8px;
}
.music-playlist::-webkit-scrollbar { width: 4px; }
.music-playlist::-webkit-scrollbar-thumb { background: var(--tertiary, #ccc); border-radius: 2px; }
.playlist-item {
  display: flex;
  align-items: center;
  padding: 5px 6px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 12px;
  color: var(--primary, #333);
  transition: background 0.15s;
  gap: 6px;
}
.playlist-item:hover { background: var(--tertiary, #f0f0f0); }
.playlist-item.active { color: #667eea; font-weight: 600; }
.playlist-item .item-num { min-width: 18px; color: var(--secondary, #aaa); font-size: 11px; }
.playlist-item .item-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.playlist-item .item-artist { color: var(--secondary, #aaa); font-size: 11px; white-space: nowrap; }
</style>

<script>
(function() {
  // 歌单 —— 使用网易云音乐外链（id 替换为你自己喜欢的歌曲ID）
  const playlist = [
    { title: "晴天", artist: "周杰伦", id: "186001" },
    { title: "夜曲", artist: "周杰伦", id: "185809" },
    { title: "稻香", artist: "周杰伦", id: "185815" },
    { title: "告白气球", artist: "周杰伦", id: "418602084" },
    { title: "七里香", artist: "周杰伦", id: "186016" },
    { title: "青花瓷", artist: "周杰伦", id: "185860" },
    { title: "演员", artist: "薛之谦", id: "32357413" },
    { title: "刚好遇见你", artist: "李玉刚", id: "400320645" },
  ];

  let current = 0;
  let isPlaying = false;
  let vol = 0.7;

  const audio = document.getElementById('music-audio');
  const player = document.getElementById('music-player');
  const toggle = document.getElementById('music-toggle');
  const titleEl = document.getElementById('music-title');
  const artistEl = document.getElementById('music-artist');
  const coverImg = document.getElementById('music-cover-img');
  const coverDiv = player.querySelector('.music-cover');
  const playIcon = document.getElementById('play-icon');
  const playBtn = document.getElementById('music-play-btn');
  const prevBtn = document.getElementById('music-prev');
  const nextBtn = document.getElementById('music-next');
  const volBtn = document.getElementById('music-volume');
  const progressBar = document.getElementById('music-progress-bar');
  const progressWrap = document.getElementById('music-progress');
  const currentTime = document.getElementById('music-current');
  const durationEl = document.getElementById('music-duration');
  const playlistEl = document.getElementById('music-playlist');

  function formatTime(s) {
    if (isNaN(s)) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function loadSong(idx) {
    const song = playlist[idx];
    titleEl.textContent = song.title;
    artistEl.textContent = song.artist;
    // 网易云音乐外链
    audio.src = 'https://music.163.com/song/media/outer/url?id=' + song.id + '.mp3';
    // 封面用网易云API
    coverImg.src = 'https://p1.music.126.net/default/default_album.jpg';
    fetch('https://netease-cloud-music-api-three-rho.vercel.app/song/detail?ids=' + song.id)
      .then(r => r.json())
      .then(d => {
        if (d.songs && d.songs[0] && d.songs[0].al && d.songs[0].al.picUrl) {
          coverImg.src = d.songs[0].al.picUrl + '?param=60y60';
        }
      }).catch(() => {});
    renderPlaylist();
  }

  function renderPlaylist() {
    playlistEl.innerHTML = '';
    playlist.forEach((song, i) => {
      const item = document.createElement('div');
      item.className = 'playlist-item' + (i === current ? ' active' : '');
      item.innerHTML = `<span class="item-num">${i + 1}</span><span class="item-title">${song.title}</span><span class="item-artist">${song.artist}</span>`;
      item.onclick = () => { current = i; loadSong(current); playAudio(); };
      playlistEl.appendChild(item);
    });
  }

  function playAudio() {
    audio.play().then(() => {
      isPlaying = true;
      playIcon.textContent = '⏸';
      coverDiv.classList.add('spinning');
    }).catch(() => {});
  }

  function pauseAudio() {
    audio.pause();
    isPlaying = false;
    playIcon.textContent = '▶';
    coverDiv.classList.remove('spinning');
  }

  // 展开/收起
  toggle.onclick = () => player.classList.toggle('collapsed');

  // 播放/暂停
  playBtn.onclick = coverDiv.onclick = () => {
    if (isPlaying) pauseAudio(); else playAudio();
  };

  prevBtn.onclick = () => { current = (current - 1 + playlist.length) % playlist.length; loadSong(current); if(isPlaying) playAudio(); };
  nextBtn.onclick = () => { current = (current + 1) % playlist.length; loadSong(current); if(isPlaying) playAudio(); };

  audio.addEventListener('ended', () => { current = (current + 1) % playlist.length; loadSong(current); playAudio(); });

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    progressBar.style.width = pct + '%';
    currentTime.textContent = formatTime(audio.currentTime);
    durationEl.textContent = formatTime(audio.duration);
  });

  progressWrap.onclick = (e) => {
    const rect = progressWrap.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    audio.currentTime = pct * audio.duration;
  };

  let muted = false;
  volBtn.onclick = () => {
    muted = !muted;
    audio.volume = muted ? 0 : vol;
    volBtn.textContent = muted ? '🔇' : '🔊';
  };
  audio.volume = vol;

  loadSong(current);
})();
</script>
{{ end }}
