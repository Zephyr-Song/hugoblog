baseURL = 'https://zephyrsong.qzz.io/'
languageCode = 'zh-cn'
title = "Zephyr's Blog"
theme = 'PaperMod'

defaultContentLanguage = "zh"
hasCJKLanguage = true

[languages]
  [languages.zh]
    title = "Zephyr's Blog"
    languageName = "中文"
    weight = 1

    [languages.zh.params]
      languageAltTitle = "中文"

    [[languages.zh.menu.main]]
      identifier = "posts"
      name = "文章"
      url = "/posts/"
      weight = 10

    [[languages.zh.menu.main]]
      identifier = "archives"
      name = "归档"
      url = "/archives/"
      weight = 20

    [[languages.zh.menu.main]]
      identifier = "tags"
      name = "标签"
      url = "/tags/"
      weight = 30

    [[languages.zh.menu.main]]
      identifier = "about"
      name = "关于"
      url = "/about/"
      weight = 40

    [[languages.zh.menu.main]]
      identifier = "search"
      name = "搜索"
      url = "/search/"
      weight = 50




# 启用资源处理
[build]
  writeStats = true

[params]
  env = "production"
  description = "Zephyr 的个人博客 — 记录科技思考、读书感悟与日常随笔"
  author = "Zephyr"
  defaultTheme = "auto"
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  # 启用搜索
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 1
    limit = 10
    keys = ["title", "permalink", "summary", "content"]

  # 启用 Home Info 模式 —— socialIcons 只在这个模式下显示
  [params.homeInfoParams]
    Title = "Hi, I'm Zephyr 👋"
    Content = """生于湖北荆州，六岁迁居湖南长沙，在青园小学、南雅初中、雅礼高中的时光里积淀成长，现就读于苏州西交利物浦大学，喜欢随处逛逛，探索世界。

闲暇时偏爱在围棋象棋的对弈中思悟，通过运动健身来感受心脏真实跳动，也常沉浸在小说漫画和游戏的世界里，让音乐伴日常，同时积极探索科技。"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Zephyr-Song"

  [[params.socialIcons]]
    name = "globe"
    url = "https://zephyr-song.github.io"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  # 动态效果和音乐播放器配置
  [params.animations]
    enabled = false

  [params.comicEffects]
    enabled = false

  [params.musicPlayer]
    enabled = true

  disableLangToggle = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

